# ERP sessions are issued by a different Supabase project.
# sync-catalog validates the token with ERP auth.getUser, the active profile,
# and the organization scope before reading or publishing any product.
[functions.sync-catalog]
verify_jwt = false

# The order bridge also validates ERP sessions inside its handler.
[functions.catalog-orders]
verify_jwt = false

# Internal dispatch secret or a verified active ERP user is required by the handler.
[functions.team-notifications]
verify_jwt = false
