name: Importar código-fonte EXCLUSIV
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar e registrar o código
        run: |
          unzip -q exclusiv-codigo-fonte.zip
          rm exclusiv-codigo-fonte.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Importar código-fonte EXCLUSIV"
          git push origin HEAD:main
