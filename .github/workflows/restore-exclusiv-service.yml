name: Restore EXCLUSIV service
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified recovery patch
        run: |
          unzip -o restore-exclusiv-service.zip
          rm restore-exclusiv-service.zip
          rm .github/workflows/restore-exclusiv-service.yml
      - name: Commit recovery
        run: |
          git config user.name "EXCLUSIV Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: reduce Supabase egress and restore service"
          git push
